<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DOMA — Administración</title>
    <style>
    .color-group{border:1px solid #d5d5d5;border-radius:6px;padding:12px;margin-top:10px;background:#fbfcfa}.color-header{display:flex;align-items:center;gap:10px;margin-bottom:10px}.color-header input[type=color]{width:48px;height:38px;padding:3px;cursor:pointer}.color-header input[data-field=color-name]{flex:1;min-width:150px}.size-list{display:grid;gap:8px}.size-row{display:grid;grid-template-columns:1fr 140px auto;gap:8px;align-items:center}.color-actions{display:flex;gap:8px;margin-top:10px}.featured-toggle{display:flex;align-items:center;gap:6px;margin-bottom:8px;font-size:12px}.featured-toggle input{accent-color:#334c3e}@media(max-width:700px){.size-row{grid-template-columns:1fr 1fr}.size-row button{grid-column:1/-1}.color-header{flex-wrap:wrap}}
    :root{font-family:Arial,sans-serif;color:#20241f;background:#f8f7f4}*{box-sizing:border-box}body{margin:0}header{padding:22px 7%;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;align-items:center;background:#fff}header a{color:#334c3e}.wrap{max-width:1200px;margin:40px auto;padding:0 24px}.card{background:#fff;border:1px solid #ddd;padding:22px;margin:20px 0;border-radius:8px}.login{max-width:420px;margin:auto}.grid{display:flex;flex-direction:column;gap:10px}.metric{background:#334c3e;color:#fff;padding:15px;border-radius:6px}.metric b{display:block;font-size:25px;margin-top:8px}.metrics-sidebar{position:fixed;z-index:4;top:76px;left:0;width:260px;max-height:calc(100vh - 76px);padding:70px 18px 18px;background:#f8f7f4;border-right:1px solid #ddd;box-shadow:4px 0 20px #0001;overflow:auto;transform:translateX(-100%);transition:transform .25s ease}.metrics-sidebar.is-open{transform:translateX(0)}.metrics-toggle{position:fixed;z-index:5;top:90px;left:18px;width:44px;height:44px;padding:9px;background:#334c3e;border:0;border-radius:6px;box-shadow:0 2px 8px #0002}.metrics-toggle span{display:block;height:2px;margin:5px 0;background:#fff}.metrics-toggle .metrics-label{display:none}.admin-content{padding-top:18px}input,textarea,button,select{padding:10px;border:1px solid #d5d5d5;border-radius:5px;font:inherit}textarea{min-height:80px;resize:vertical}form{display:grid;gap:10px}.btn{background:#334c3e;color:#fff;border:0;cursor:pointer}.btn-danger{background:#963f35;color:#fff;border:0;cursor:pointer}.btn-secondary{background:#fff;color:#334c3e;border:1px solid #334c3e;cursor:pointer}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px}.order{border-top:1px solid #ddd;padding:14px 0}.product{border-top:1px solid #ddd;padding:16px 0;display:flex;justify-content:space-between;gap:16px}.product:first-child{border-top:0}.product-info{flex:1}.product-actions{white-space:nowrap}.variant-row{display:grid;grid-template-columns:54px 1fr 120px auto;gap:8px;align-items:center}.variant-row input[type=color]{width:54px;height:42px;padding:4px;cursor:pointer}.file-field{display:grid;gap:6px;padding:12px;border:1px dashed #c9cfc7;border-radius:5px;background:#fbfcfa}.file-field input[type=file]{padding:5px;border:0;background:transparent}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.full{grid-column:1/-1}.message{color:#963f35;min-height:20px}.success{color:#2e704b}.muted{color:#666;font-size:13px}.checkbox{display:flex;align-items:center;gap:8px}@media(max-width:700px){.metrics-sidebar{width:min(260px,88vw)}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.variant-row{grid-template-columns:54px 1fr}.variant-row button{grid-column:1/-1}.product{display:block}.product-actions{margin-top:12px}}
  </style>
</head>
<body>
  <header><b>DOMA / ADMIN</b><a href="/">Volver a la tienda</a></header>
  <main class="wrap">
    <section id="login" class="card login"><h2>Acceso administrativo</h2><form id="login-form"><input name="email" type="email" value="admin@doma.local" required><input name="password" type="password" placeholder="Contraseña" required><button class="btn">Ingresar</button></form><p id="message" class="message"></p></section>
    <section id="panel" hidden><button id="metrics-toggle" class="metrics-toggle" aria-expanded="false" aria-controls="metrics" aria-label="Abrir resumen"><span></span><span></span><span></span></button><aside id="metrics" class="grid metrics-sidebar" aria-hidden="true"></aside><div class="admin-content">
      <div class="card"><div class="toolbar"><h2>Productos</h2><button id="logout" class="btn-secondary">Cerrar sesión</button></div><p class="muted">Desde acá podés agregar productos nuevos o quitarlos de la tienda.</p>
        <form id="product-form"><div class="form-grid"><input name="name" placeholder="Nombre del producto (ej. Remeras Essential)" required><select name="category" required><option value="">Elegí una prenda</option><option>Remeras</option><option>Gorras</option><option>Pantalones</option><option>Camisas</option><option>Abrigos</option><option>Accesorios</option><option>Vestidos</option><option>Calzado</option><option>Otros</option></select><input name="price" type="number" min="1" step="0.01" placeholder="Precio" required><input name="previousPrice" type="number" min="0" step="0.01" placeholder="Precio anterior (opcional)"><label class="file-field full">Elegí una foto desde tu carpeta<input name="imageFile" type="file" accept="image/*" required><small id="image-message">La imagen se ajustará automáticamente.</small></label><textarea name="description" class="full" placeholder="Descripción: contá qué destaca de esta prenda" required></textarea></div><label class="checkbox"><input name="featured" type="checkbox"> Mostrar como destacado</label><div><b>Colores, talles y stock</b><div id="variants"></div></div><div><button type="button" id="add-color" class="btn-secondary">+ Agregar otro color</button></div><button class="btn">Agregar producto</button><p id="product-message" class="message"></p></form>
        <div id="products"></div>
      </div>
      <div class="card"><h2>Pedidos</h2><div id="orders"></div></div></div>
    </section>
  </main>
  <script src="admin.js"></script>
</body>
</html>
