<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DOMA — Administración</title><style>body{font:14px Arial;margin:0;background:#f8f7f4;color:#20241f}header{padding:22px 7%;border-bottom:1px solid #ddd;display:flex;justify-content:space-between}.wrap{max-width:1200px;margin:40px auto;padding:0 24px}.card{background:#fff;border:1px solid #ddd;padding:22px;margin:20px 0}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.metric{background:#334c3e;color:#fff;padding:15px}.metric b{display:block;font-size:25px;margin-top:8px}.login{max-width:420px;margin:auto}input,textarea,button,select{padding:10px;border:1px solid #ddd;font:inherit}form{display:grid;gap:10px}.btn{background:#334c3e;color:#fff;border:0}.toolbar{display:flex;justify-content:space-between;align-items:center}.order{border-top:1px solid #ddd;padding:14px 0}.message{color:#963f35}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><header><b>DOMA / ADMIN</b><a href="/">Volver a la tienda</a></header><main class="wrap"><section id="login" class="card login"><h2>Acceso administrativo</h2><form id="login-form"><input name="email" type="email" value="admin@doma.local" required><input name="password" type="password" placeholder="Contraseña" required><button class="btn">Ingresar</button></form><p id="message" class="message"></p></section><section id="panel" hidden><div id="metrics" class="grid"></div><div class="card"><div class="toolbar"><h2>Pedidos</h2><button id="logout">Cerrar sesión</button></div><div id="orders"></div></div><div class="card"><h2>Productos</h2><div id="products"></div></div></section></main><script src="/admin/admin.js"></script></body></html>
