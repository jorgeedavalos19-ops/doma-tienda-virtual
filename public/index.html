<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DOMA — tienda virtual</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/carousel.css"></head><body>
<header><a class="brand" href="#">DOMA</a><nav><a href="#catalogo">Catálogo</a><a href="/admin/">Administración</a></nav><button id="cart-button">Carrito <span id="cart-count">0</span></button></header>
<button id="category-toggle" class="category-toggle" aria-expanded="false" aria-controls="category-menu" aria-label="Abrir categorías"><span></span><span></span><span></span></button><aside id="category-menu" class="category-menu" aria-hidden="true"><h3>Categorías</h3><div id="category-list"></div></aside><main><section class="featured-carousel" aria-label="Productos destacados"><div class="carousel-track" id="carousel-track"></div><button class="carousel-control carousel-prev" id="carousel-prev" aria-label="Producto anterior">‹</button><button class="carousel-control carousel-next" id="carousel-next" aria-label="Producto siguiente">›</button><div class="carousel-dots" id="carousel-dots"></div></section>
<section id="catalogo" class="section"><div class="section-heading"><div><small>COLECCIÓN DOMA</small><h2>Encontrá tus favoritos</h2></div><span id="product-count"></span></div><div id="products" class="products"></div></section>
<section id="admin" class="section admin-section"><div class="section-heading"><div><small>PANEL PRIVADO</small><h2>Administración</h2></div></div><div id="login-box" class="card"><h3>Ingresar</h3><form id="login-form"><input name="email" type="email" placeholder="Email" value="admin@doma.local" required><input name="password" type="password" placeholder="Contraseña" required><button class="button">Ingresar</button><p id="login-message" class="message"></p></form><small>Prototipo: configurar ADMIN_PASSWORD antes de iniciar el servidor.</small></div><div id="admin-panel" hidden><button id="dashboard-toggle" class="dashboard-toggle" aria-expanded="false" aria-controls="dashboard" aria-label="Abrir resumen"><span></span><span></span><span></span></button><div class="dashboard dashboard-sidebar" id="dashboard" aria-hidden="true"></div><div class="admin-content"><div class="admin-columns"><div class="card"><h3>Nuevo producto</h3><form id="product-form"><input name="name" placeholder="Nombre" required><input name="category" placeholder="Categoría" value="Remeras" required><textarea name="description" placeholder="Descripción"></textarea><input name="price" type="number" min="1" placeholder="Precio" required><input name="image" placeholder="URL de imagen" required><textarea name="variants" placeholder='Variantes JSON: [{"color":"Negro","size":"M","stock":5}]' required>[{"color":"Negro","size":"M","stock":5}]</textarea><button class="button">Crear producto</button><p id="product-message" class="message"></p></form></div><div class="card"><div class="toolbar"><h3>Pedidos</h3><button id="logout">Cerrar sesión</button></div><div id="orders"></div></div></div><div class="card"><h3>Productos</h3><div id="admin-products"></div></div></div></div></section></main>
<button id="cart-float" class="cart-float" aria-label="Abrir bolsa de compras">🛍️ <span id="cart-float-count">0</span></button><aside id="cart-drawer" hidden><div class="toolbar"><h2>Tu bolsa</h2><button id="close-cart">×</button></div><div id="cart-items"></div><div class="cart-footer"><strong>Total <span id="cart-total"></span></strong><h3>Datos para retirar en el local</h3><form id="checkout-form" class="checkout-form"><input name="name" placeholder="Nombre y apellido" required><input name="phone" type="tel" placeholder="Teléfono" required><input name="email" type="email" placeholder="Email (opcional)"><input name="dniLast3" inputmode="numeric" pattern="[0-9]{3}" maxlength="3" placeholder="3 últimos números del DNI" required><button class="button" type="submit">Confirmar retiro</button><p id="checkout-message" class="message"></p></form></div></aside><div id="toast" class="toast"></div><script src="/app.js"></script></body></html>
